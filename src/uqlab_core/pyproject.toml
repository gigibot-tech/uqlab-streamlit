[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqlab-core"
version = "0.1.0"
description = "Minimal UQLab core — data, train, eval for notebooks and benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dinov2 = ["transformers>=4.36.0"]
ek_fak = ["kronfluence>=0.1.0"]

[tool.setuptools.package-dir]
"uqlab_core" = "."

[tool.setuptools.package-data]
uqlab_core = ["configs/**/*.yaml", "configs/**/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["uqlab_core*"]
